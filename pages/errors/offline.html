<div class="page-container error-page">
  <div class="page-header">
    <div>
      <h1>Offline</h1>
      <p class="page-subtitle">You Are Offline</p>
    </div>
  </div>
  <div class="empty-state" style="padding:60px 20px">
    <i class="fa-solid fa-wifi-slash" style="font-size:72px;color:var(--txt-muted);opacity:0.3"></i>
    <h2 style="margin-top:16px;font-size:22px;font-weight:700">You Are Offline</h2>
    <p style="color:var(--txt-secondary);max-width:380px;margin:12px auto">
      Internet connection unavailable. Some features may not be available until you reconnect.
    </p>
    <p style="color:var(--txt-muted);font-size:13px;margin-bottom:8px">
      Cached pages and data are still accessible.
    </p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="location.reload()">
        <i class="fa-solid fa-rotate"></i> Retry
      </button>
      <button class="btn btn-secondary" onclick="Router.navigate('dashboard')">
        <i class="fa-solid fa-gauge-high"></i> Offline Dashboard
      </button>
    </div>
  </div>
</div>
