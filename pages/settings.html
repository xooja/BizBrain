<!-- pages/settings.html -->
<div class="page-container">

  <style>
    @media (max-width: 768px) {
      .page-container .dash-grid { grid-template-columns: 1fr !important; }
      .page-container .dash-grid .section-card { grid-column: 1 !important; }
      .page-container .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 12px; }
      .page-container .page-header { flex-direction: column; align-items: stretch; }
      .page-container .page-header .header-actions { flex-direction: column; align-items: stretch; }
      .page-container .page-header .header-actions .btn { width: 100%; justify-content: center; }
      .page-container .stat-card { padding: 16px; }
      .page-container .stat-value { font-size: 20px; }
      .page-container .section-header { flex-wrap: wrap; gap: 8px; padding: 16px; }
      .page-container .section-body { padding: 12px 16px !important; }
    }
    @media (max-width: 480px) {
      .page-container .stats-grid { grid-template-columns: 1fr 1fr !important; gap: 8px; }
      .page-container .stat-card { padding: 12px; }
      .page-container .stat-value { font-size: 18px; }
    }
  </style>

  <!-- ─── PAGE HEADER ────────────────────────────────────────── -->
  <div class="page-header">
    <div>
      <h1>Settings</h1>
      <p class="page-subtitle">Manage your account and preferences</p>
    </div>
    <div class="header-actions" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="saveSettings()">
        <i class="fa-solid fa-check"></i> Save Settings
      </button>
    </div>
  </div>

  <!-- ─── SETTINGS GRID ────────────────────────────────────── -->
  <div class="dash-grid">

    <!-- Business Settings -->
    <div class="section-card dash-grid-full">
      <div class="section-header">
        <div class="section-title"><i class="fa-solid fa-building" style="color:var(--accent);margin-right:8px"></i>Business Info</div>
      </div>
      <div class="section-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
          <div class="form-group">
            <label>Business Name</label>
            <div class="input-wrap"><i class="fa-solid fa-building"></i>
              <input type="text" id="s-biz-name" placeholder="My Company LLC" />
            </div>
          </div>
          <div class="form-group">
            <label>Currency</label>
            <select id="s-currency">
              <option value="USD">USD — US Dollar</option>
              <option value="EUR">EUR — Euro</option>
              <option value="GBP">GBP — British Pound</option>
              <option value="CAD">CAD — Canadian Dollar</option>
              <option value="AUD">AUD — Australian Dollar</option>
              <option value="JPY">JPY — Japanese Yen</option>
              <option value="INR">INR — Indian Rupee</option>
            </select>
          </div>
          <div class="form-group">
            <label>Timezone</label>
            <select id="s-timezone">
              <option value="UTC">UTC</option>
              <option value="America/New_York">Eastern Time</option>
              <option value="America/Chicago">Central Time</option>
              <option value="America/Denver">Mountain Time</option>
              <option value="America/Los_Angeles">Pacific Time</option>
              <option value="Europe/London">London</option>
              <option value="Europe/Paris">Paris</option>
              <option value="Asia/Tokyo">Tokyo</option>
              <option value="Asia/Kolkata">India</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile -->
    <div class="section-card dash-grid-full">
      <div class="section-header">
        <div class="section-title"><i class="fa-solid fa-user" style="color:var(--accent-2);margin-right:8px"></i>Profile</div>
      </div>
      <div class="section-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
          <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrap"><i class="fa-solid fa-user"></i>
              <input type="text" id="s-name" placeholder="Your Name" />
            </div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <div class="input-wrap"><i class="fa-solid fa-envelope"></i>
              <input type="email" id="s-email" placeholder="you@company.com" readonly style="opacity:0.6;cursor:not-allowed" />
            </div>
            <p class="form-hint">Email cannot be changed here.</p>
          </div>
          <div class="form-group">
            <label>New Password</label>
            <div class="input-wrap"><i class="fa-solid fa-lock"></i>
              <input type="password" id="s-password" placeholder="Leave blank to keep current" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Sync & Data -->
    <div class="section-card dash-grid-full">
      <div class="section-header">
        <div class="section-title"><i class="fa-solid fa-rotate" style="color:var(--success);margin-right:8px"></i>Sync & Data</div>
      </div>
      <div class="section-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">
            <div>
              <div style="font-weight:500;font-size:14px">Pending Changes</div>
              <div style="font-size:12px;color:var(--txt-secondary)">Items waiting to sync</div>
            </div>
            <span id="pending-count" style="font-size:24px;font-family:var(--font-head);font-weight:800;color:var(--warning)">—</span>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
            <button class="btn btn-secondary" onclick="forcSync()">
              <i class="fa-solid fa-rotate"></i> Force Sync Now
            </button>
            <button class="btn btn-danger" onclick="clearCache()">
              <i class="fa-solid fa-trash"></i> Clear Cache
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- About -->
    <div class="section-card dash-grid-full">
      <div class="section-header">
        <div class="section-title"><i class="fa-solid fa-brain" style="color:var(--accent);margin-right:8px"></i>About BizBrain</div>
      </div>
      <div class="section-body">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;text-align:center">
          <div style="padding:16px 0">
            <div class="logo-icon" style="margin:0 auto 12px;width:56px;height:56px;font-size:24px">
              <i class="fa-solid fa-brain"></i>
            </div>
            <div style="font-family:var(--font-head);font-size:20px;font-weight:800;margin-bottom:4px">BizBrain</div>
            <div style="color:var(--txt-secondary);font-size:13px;margin-bottom:16px">Offline-First Business Manager</div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start">
            <div style="background:var(--bg-glass);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)">
              <div style="font-size:11px;color:var(--txt-muted)">Version</div>
              <div style="font-size:14px;font-weight:600">1.0.0</div>
            </div>
            <div style="background:var(--bg-glass);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)">
              <div style="font-size:11px;color:var(--txt-muted)">Storage</div>
              <div style="font-size:14px;font-weight:600">IndexedDB</div>
            </div>
            <div style="background:var(--bg-glass);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)">
              <div style="font-size:11px;color:var(--txt-muted)">Backend</div>
              <div style="font-size:14px;font-weight:600">PHP 8+</div>
            </div>
            <div style="background:var(--bg-glass);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border)">
              <div style="font-size:11px;color:var(--txt-muted)">Database</div>
              <div style="font-size:14px;font-weight:600">MySQL</div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
