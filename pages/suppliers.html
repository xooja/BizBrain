<div class="page-container">

  <!-- ─── RESPONSIVE STYLE OVERRIDES ─────────────────────────── -->
  <style>
    @media (max-width: 768px) {
      .page-container .dash-grid { grid-template-columns: 1fr !important; }
      .page-container .dash-grid .section-card { grid-column: 1 !important; }
      .page-container .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 12px; }
      .page-container .page-header { flex-direction: column; align-items: stretch; }
      .page-container .page-header .header-actions { flex-direction: column; align-items: stretch; }
      .page-container .header-actions select,
      .page-container .header-actions .search-box { width: 100% !important; min-width: 0 !important; }
      .page-container .header-actions .btn { width: 100%; justify-content: center; }
      .page-container .stat-card { padding: 16px; }
      .page-container .stat-value { font-size: 20px; }
      .page-container .section-header { flex-wrap: wrap; gap: 8px; padding: 16px; }
      .page-container .section-body { padding: 8px 12px !important; }
      .page-container .table-footer { flex-direction: row; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
      .page-container .pagination { gap: 2px; }
      .page-container .page-btn { width: 28px; height: 28px; font-size: 11px; }
    }
    @media (max-width: 480px) {
      .page-container .stats-grid { grid-template-columns: 1fr 1fr !important; gap: 8px; }
      .page-container .stat-card { padding: 12px; }
      .page-container .stat-value { font-size: 18px; }
      .page-container .quick-actions { grid-template-columns: 1fr !important; }
      .page-container .quick-action-btn { padding: 8px !important; font-size: 11px !important; }
      .page-container .data-table th,
      .page-container .data-table td { padding: 8px 8px !important; font-size: 12px; }
      .page-container .cell-name { font-size: 12px; }
      .page-container .cell-sub { font-size: 10px; }
      .page-container .avatar.sm { width: 24px; height: 24px; font-size: 9px; }
    }
  </style>

  <!-- ─── PAGE HEADER ────────────────────────────────────────── -->
  <div class="page-header">
    <div>
      <h1>Suppliers</h1>
      <p class="page-subtitle">Manage your suppliers and vendors</p>
    </div>
    <div class="header-actions" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div class="search-box input-wrap" style="min-width:220px">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="supplier-search" placeholder="Search suppliers..." />
      </div>
      <select id="supplier-status-filter" style="width:auto;min-width:130px;padding:10px 14px">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
      <button class="btn btn-primary" onclick="openSupplierModal()">
        <i class="fa-solid fa-plus"></i> Add Supplier
      </button>
    </div>
  </div>

  <!-- ─── STATS GRID (4 DASHBOARD WIDGETS) ─────────────────── -->
  <div class="stats-grid">
    <!-- 1. Total Suppliers -->
    <div class="stat-card blue">
      <div class="stat-icon blue"><i class="fa-solid fa-truck"></i></div>
      <div class="stat-value" id="sup-total">0</div>
      <div class="stat-label">Total Suppliers</div>
      <div class="stat-change up" id="sup-trend" style="display:none">
        <i class="fa-solid fa-arrow-up"></i> <span id="sup-trend-val">0</span>%
      </div>
    </div>

    <!-- 2. Recent Suppliers -->
    <div class="stat-card purple">
      <div class="stat-icon purple"><i class="fa-solid fa-clock-rotate-left"></i></div>
      <div class="stat-value" id="sup-recent-count">0</div>
      <div class="stat-label">Added This Month</div>
      <div style="margin-top:8px;font-size:12px;color:var(--txt-muted)">
        Latest: <span id="sup-latest-name">—</span>
      </div>
    </div>

    <!-- 3. Supplier Payments -->
    <div class="stat-card green">
      <div class="stat-icon green"><i class="fa-solid fa-credit-card"></i></div>
      <div class="stat-value" id="sup-balance-total">$0</div>
      <div class="stat-label">Total Outstanding Balance</div>
      <div style="margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px">
        <span style="color:var(--warning)">Pending</span>
        <div style="flex:1;height:5px;background:var(--bg-glass);border-radius:3px;overflow:hidden">
          <div id="sup-payment-bar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--warning),var(--success));border-radius:3px;transition:width 0.6s ease"></div>
        </div>
        <span style="color:var(--success)">Paid</span>
      </div>
    </div>

    <!-- 4. Quick Actions -->
    <div class="stat-card orange">
      <div class="stat-icon orange"><i class="fa-solid fa-bolt"></i></div>
      <div class="stat-label" style="font-size:14px;font-weight:600;margin-bottom:12px">Quick Actions</div>
      <div class="quick-actions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="quick-action-btn" onclick="openSupplierModal()" style="padding:10px;font-size:12px;gap:8px">
          <i class="fa-solid fa-plus" style="width:28px;height:28px;font-size:12px;background:rgba(59,130,246,0.15);color:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center"></i>
          <span>Add Supplier</span>
        </button>
        <button class="quick-action-btn" onclick="document.getElementById('supplier-table-section').scrollIntoView({behavior:'smooth'})" style="padding:10px;font-size:12px;gap:8px">
          <i class="fa-solid fa-list" style="width:28px;height:28px;font-size:12px;background:rgba(139,92,246,0.15);color:var(--accent-2);border-radius:6px;display:flex;align-items:center;justify-content:center"></i>
          <span>View All</span>
        </button>
        <button class="quick-action-btn" onclick="exportSupplierData()" style="padding:10px;font-size:12px;gap:8px">
          <i class="fa-solid fa-download" style="width:28px;height:28px;font-size:12px;background:rgba(16,185,129,0.15);color:var(--success);border-radius:6px;display:flex;align-items:center;justify-content:center"></i>
          <span>Export CSV</span>
        </button>
        <button class="quick-action-btn" onclick="Router.navigate('purchase_invoices')" style="padding:10px;font-size:12px;gap:8px">
          <i class="fa-solid fa-cart-shopping" style="width:28px;height:28px;font-size:12px;background:rgba(245,158,11,0.15);color:var(--warning);border-radius:6px;display:flex;align-items:center;justify-content:center"></i>
          <span>Purchases</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ─── MAIN CONTENT GRID ─────────────────────────────────── -->
  <div class="dash-grid">

    <!-- ─── SUPPLIER LIST TABLE (LEFT / MAIN) ──────────────── -->
    <div class="section-card" id="supplier-table-section" style="grid-column:1">
      <div class="section-header">
        <div class="section-title"><i class="fa-solid fa-truck" style="margin-right:8px;color:var(--accent)"></i>All Suppliers</div>
        <span style="font-size:12px;color:var(--txt-muted)" id="sup-count-label">0 suppliers</span>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th class="col-pri">Name</th>
              <th class="col-pri">Phone</th>
              <th class="col-secondary">Company</th>
              <th class="col-pri">Balance</th>
              <th class="col-secondary">Status</th>
              <th class="col-pri">Actions</th>
            </tr>
          </thead>
          <tbody id="suppliers-tbody"></tbody>
        </table>
      </div>
      <div class="table-footer">
        <span id="sup-showing-label">Showing 0 of 0</span>
        <div class="pagination" id="sup-pagination"></div>
      </div>
    </div>

    <!-- ─── RECENT ACTIVITY PANEL (RIGHT SIDEBAR) ──────────── -->
    <div class="section-card" style="grid-column:2">
      <div class="section-header">
        <div class="section-title"><i class="fa-solid fa-clock-rotate-left" style="margin-right:8px;color:var(--accent-2)"></i>Recent Activity</div>
      </div>
      <div class="section-body" style="padding:8px 16px">
        <div class="activity-feed" id="supplier-activity-feed">
          <div class="empty-state" style="padding:24px">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <p style="font-size:13px">Activity tracking will appear here</p>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>
