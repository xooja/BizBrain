<div class="page-container">

  <style>
    @media (max-width: 768px) {
      .page-container .dash-grid { grid-template-columns: 1fr !important; }
      .page-container .dash-grid .section-card { grid-column: 1 !important; }
      .page-container .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 12px; }
      .page-container .page-header { flex-direction: column; align-items: stretch; }
      .page-container .page-header .header-actions { flex-direction: column; align-items: stretch; }
      .page-container .header-actions select,
      .page-container .header-actions .search-box { width: 100% !important; min-width: 0 !important; }
      .page-container .header-actions .btn { width: 100%; justify-content: center; }
      .page-container .stat-card { padding: 16px; }
      .page-container .stat-value { font-size: 20px; }
      .page-container .section-header { flex-wrap: wrap; gap: 8px; padding: 16px; }
      .page-container .section-body { padding: 8px 12px !important; }
      .page-container .data-table th,
      .page-container .data-table td { padding: 8px 8px !important; font-size: 12px; }
      .page-container .table-footer { flex-direction: row; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
      .page-container .pagination { gap: 2px; }
      .page-container .page-btn { width: 28px; height: 28px; font-size: 11px; }
      .page-container .quick-actions { grid-template-columns: repeat(2, 1fr) !important; }
      .page-container .quick-action-btn { padding: 8px !important; font-size: 11px !important; }
    }
    @media (max-width: 480px) {
      .page-container .stats-grid { grid-template-columns: 1fr 1fr !important; gap: 8px; }
      .page-container .stat-card { padding: 12px; }
      .page-container .stat-value { font-size: 18px; }
      .page-container .quick-actions { grid-template-columns: 1fr !important; }
      .page-container .quick-action-btn { padding: 8px !important; font-size: 11px !important; }
      .page-container .data-table th,
      .page-container .data-table td { padding: 8px 8px !important; font-size: 12px; }
      .page-container .cell-name { font-size: 12px; }
      .page-container .cell-sub { font-size: 10px; }
      .page-container .avatar.sm { width: 24px; height: 24px; font-size: 9px; }
    }
  </style>

  <!-- ─── PAGE HEADER ────────────────────────────────────────── -->
  <div class="page-header">
    <div>
      <h1>Team</h1>
      <p class="page-subtitle">Manage team members and roles</p>
    </div>
    <div class="header-actions" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button class="btn btn-secondary" onclick="navigateToRole()">
        <i class="fa-solid fa-shield"></i> Roles
      </button>
      <button class="btn btn-primary" onclick="openTeamMemberModal()">
        <i class="fa-solid fa-plus"></i> Add Member
      </button>
    </div>
  </div>

  <!-- ─── STATS GRID (4 DASHBOARD WIDGETS) ─────────────────── -->
  <div class="stats-grid">
    <div class="stat-card blue">
      <div class="stat-icon blue"><i class="fa-solid fa-users"></i></div>
      <div class="stat-value" id="team-total-count">0</div>
      <div class="stat-label">Total Members</div>
    </div>
    <div class="stat-card green">
      <div class="stat-icon green"><i class="fa-solid fa-user-check"></i></div>
      <div class="stat-value" id="team-active-count">0</div>
      <div class="stat-label">Active Members</div>
    </div>
    <div class="stat-card purple">
      <div class="stat-icon purple"><i class="fa-solid fa-user-tag"></i></div>
      <div class="stat-value" id="team-role-count">0</div>
      <div class="stat-label">Roles</div>
    </div>
    <div class="stat-card orange">
      <div class="stat-icon orange"><i class="fa-solid fa-bolt"></i></div>
      <div class="stat-label" style="font-size:14px;font-weight:600;margin-bottom:12px">Quick Actions</div>
      <div class="quick-actions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="quick-action-btn" onclick="openTeamMemberModal()" style="padding:10px;font-size:12px;gap:8px">
          <i class="fa-solid fa-user-plus" style="width:28px;height:28px;font-size:12px;background:rgba(59,130,246,0.15);color:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center"></i>
          <span>Add Member</span>
        </button>
        <button class="quick-action-btn" onclick="navigateToRole()" style="padding:10px;font-size:12px;gap:8px">
          <i class="fa-solid fa-shield" style="width:28px;height:28px;font-size:12px;background:rgba(139,92,246,0.15);color:var(--accent-2);border-radius:6px;display:flex;align-items:center;justify-content:center"></i>
          <span>Roles</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ─── MAIN CONTENT GRID ─────────────────────────────────── -->
  <div class="dash-grid">

    <!-- ─── TEAM MEMBER TABLE (LEFT) ─────────────────────────── -->
    <div class="section-card" style="grid-column:1">
      <div class="section-header">
        <div class="section-title"><i class="fa-solid fa-users-gear" style="margin-right:8px;color:var(--accent)"></i>Team Members</div>
        <span style="font-size:12px;color:var(--txt-muted)" id="team-count-label">0 members</span>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="team-tbody">
            <tr><td colspan="6"><div class="page-loader"><div class="spinner"></div></div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="table-footer">
        <span id="team-showing-label">Showing 0 of 0</span>
        <div class="pagination" id="team-pagination"></div>
      </div>
    </div>

    <!-- ─── RECENT ACTIVITY (RIGHT SIDEBAR) ─────────────────── -->
    <div class="section-card" style="grid-column:2">
      <div class="section-header">
        <div class="section-title"><i class="fa-solid fa-clock-rotate-left" style="margin-right:8px;color:var(--accent-2)"></i>Recent Activity</div>
      </div>
      <div class="section-body" style="padding:8px 16px">
        <div class="activity-feed" id="team-activity-feed">
          <div class="empty-state" style="padding:24px">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <p style="font-size:13px">Activity tracking will appear here</p>
          </div>
        </div>
      </div>
    </div>

  </div>

</div>

<script>
function navigateToRole() { /* placeholder for roles management */ }
</script>
